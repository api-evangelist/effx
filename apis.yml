name: effx
description: >-
  effx was a San Francisco developer-tools startup, founded in 2018 by Joey Parsons, that built a
  modern microservice catalog to help engineering teams navigate and operate microservices
  architectures — tracking service ownership, cataloging services, enforcing service standards,
  tracking migrations, and supporting incident response. The company raised a $3.9M seed round led by
  Kleiner Perkins alongside Cowboy Ventures. effx was acquired by Figma in 2021; the product was shut
  down and the team joined Figma's engineering organization. effx.com is now an acquisition/farewell
  notice and there is no live API, developer documentation, SDK, or public source surface to enrich.
